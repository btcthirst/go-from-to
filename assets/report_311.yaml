# Конфігурація звіту "Журнал-ордер 311"
#
# Файл категорій має структуру:
#   НазваКатегорії:
#     type: debit | credit
#     keywords: [...]
#
# Тут лише вказуємо які категорії в який стовпець звіту йдуть.

# main_categories — категорії що йдуть у стовпці D/E (Дт рах.311 / Оборот по Дт)
# Мають збігатись з ключами у файлі категорій
main_categories:
  - "Внески"
  - "Контрагенти"

# sub_columns — стовпці F..K ("С Кт 311 в Дт рахунків")
# account  — заголовок колонки в таблиці (номер рахунку)
# category — назва категорії (ключ у файлі категорій)
sub_columns:
  - account: "313"
    category: "Зарплата"
  - account: "63"
    category: "Комунальні"
  - account: "641"
    category: "ПДФО"
  - account: "641.1"
    category: "Військовий"
  - account: "651"
    category: "ЄСВ"
  - account: "94"
    category: "Комісія банку"